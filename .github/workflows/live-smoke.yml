name: Live market smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  silver-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run real Dukascopy BI5 end-to-end smoke
        run: python scripts/live_smoke_test.py

      - name: Print smoke report
        if: always()
        run: |
          if [ -f smoke_live/smoke_result.json ]; then
            cat smoke_live/smoke_result.json
          fi
