name: Live market smoke

on:
  pull_request:
    branches: [main]

concurrency:
  group: live-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  silver-live-smoke:
    if: github.head_ref == 'agent/metals-ml-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify Node runtime
        run: node --version && npm --version && npx --version

      - name: Run live end-to-end smoke
        run: python scripts/live_smoke_test.py

      - name: Print smoke report
        if: always()
        run: |
          if [ -f smoke_live/smoke_result.json ]; then
            cat smoke_live/smoke_result.json
          fi
