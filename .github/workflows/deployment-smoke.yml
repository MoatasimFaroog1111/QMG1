name: Deployment smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS base URL of the deployed QMG1 service
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify deployed service
        env:
          QMG1_API_KEY: ${{ secrets.QMG1_API_KEY }}
          QMG1_BASE_URL: ${{ inputs.base_url }}
        run: python scripts/deployment_smoke.py --base-url "$QMG1_BASE_URL"

