name: Full Metals Training

on:
  workflow_dispatch:
    inputs:
      metal:
        description: Metal to download and train
        required: true
        default: silver
        type: choice
        options:
          - silver
          - gold
          - palladium
          - platinum
  push:
    branches:
      - "agent/metals-ml-foundation"
      - "agent/full-training-execution"
    paths:
      - ".github/triggers/full-training"

permissions:
  contents: read

concurrency:
  group: qmg1-full-training-${{ github.event.inputs.metal || 'silver' }}
  cancel-in-progress: false

jobs:
  full-training:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      METAL: ${{ github.event.inputs.metal || 'silver' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify Node runtime
        run: node --version && npx --version

      - name: Download target M1 and compact to H1 USD per kg
        run: python scripts/prepare_hourly_training_data.py --metal "$METAL" --cleanup-raw

      - name: Download Gold exogenous context for Silver
        if: env.METAL == 'silver'
        run: python scripts/prepare_hourly_training_data.py --metal gold --cleanup-raw

      - name: Download US Dollar Index context for Silver
        if: env.METAL == 'silver'
        run: python scripts/prepare_market_series.py --series udx --cleanup-raw

      - name: Download S&P 500 context for Silver
        if: env.METAL == 'silver'
        run: python scripts/prepare_market_series.py --series spx --cleanup-raw

      - name: Preserve hourly training datasets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qmg1-${{ env.METAL }}-hourly-${{ github.run_id }}
          path: training_data/hourly/*.csv
          if-no-files-found: error
          retention-days: 14

      - name: Train all requested horizons
        run: python scripts/train_hourly_models.py --metal "$METAL"

      - name: Show training report
        run: cat "models/$METAL/${METAL}_training_report.json"

      - name: Upload persisted models and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qmg1-${{ env.METAL }}-models-${{ github.run_id }}
          path: models/${{ env.METAL }}/
          if-no-files-found: error
          retention-days: 14
