name: Silver Shrinkage Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/experiment-silver-shrinkage.yml"

concurrency:
  group: qmg1-silver-shrinkage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  train-silver:
    if: github.head_ref == 'agent/metric-shrinkage'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      METAL: silver

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Download Silver target H1
        run: python scripts/prepare_hourly_training_data.py --metal silver --cleanup-raw

      - name: Download Gold context
        run: python scripts/prepare_hourly_training_data.py --metal gold --cleanup-raw

      - name: Download US Dollar Index context
        run: python scripts/prepare_market_series.py --series udx --cleanup-raw

      - name: Download S&P 500 context
        run: python scripts/prepare_market_series.py --series spx --cleanup-raw

      - name: Train all requested horizons
        run: python scripts/train_hourly_models.py --metal silver

      - name: Show training report
        run: cat models/silver/silver_training_report.json

      - name: Upload models and report
        uses: actions/upload-artifact@v4
        with:
          name: qmg1-silver-shrinkage-${{ github.run_id }}
          path: models/silver/
          if-no-files-found: error
          retention-days: 14
