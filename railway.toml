[build]
builder = "railpack"

[deploy]
startCommand = "uvicorn qmg1.api.app:app --app-dir src --host 0.0.0.0 --port ${PORT:-8000} --workers ${WEB_CONCURRENCY:-2} --timeout-keep-alive 5 --limit-concurrency ${UVICORN_LIMIT_CONCURRENCY:-100} --backlog 128"
healthcheckPath = "/readyz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
