[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Keep CI deterministic across Ruff releases. Functional correctness and
# likely bugs are enforced here; formatting/import cosmetics are not allowed
# to silently expand when Ruff changes its default rule set.
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
